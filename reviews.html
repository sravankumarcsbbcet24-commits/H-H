<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hygiene Audit Records</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#07111f,#102a43,#075985);
color:white;
padding:35px;
}

.header{
max-width:1200px;
margin:auto;
text-align:center;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:24px;
margin-bottom:35px;
}

.container{
max-width:1200px;
margin:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:22px;
}

.center-card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(18px);
border-radius:22px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.center-card:hover{
transform:translateY(-8px);
}

.center-image{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h2{
margin-bottom:10px;
}

.rating{
font-size:20px;
margin-bottom:10px;
}

.reviews{
margin-bottom:15px;
}

.view-btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.empty{
text-align:center;
padding:50px;
background:rgba(255,255,255,.1);
border-radius:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>🏛️ Hygiene Audit Records</h1>

<p>Health and Hygiene Awareness & Hygiene Audit System</p>

</div>

<div class="container">

<div class="cards" id="cards"></div>

</div>

<script>

let centers=
JSON.parse(
localStorage.getItem(
"foodCenters"
)
)||[];

let reviews=
JSON.parse(
localStorage.getItem(
"reviews"
)
)||[];

let cards=
document.getElementById(
"cards"
);

function getCenterReviews(name){

return reviews.filter(

review=>

review.foodCenter===name

);

}

function displayCenters(){

if(centers.length===0){

cards.innerHTML=

'<div class="empty"><h2>No Food Centers Available</h2></div>';

return;

}

cards.innerHTML="";

centers.forEach(

(center,index)=>{

let centerReviews=

getCenterReviews(
center.name
);

let overall=0;

if(centerReviews.length){

centerReviews.forEach(

review=>{

overall+=(

Number(review.cleanliness)+
Number(review.foodQuality)+
Number(review.staffBehaviour)+
Number(review.environment)

)/4;

}

);

overall=(

overall/
centerReviews.length

).toFixed(1);

}else{

overall="0.0";

}

cards.innerHTML+=`

<div
class="center-card"
onclick="openAudit(${index})">

<img
class="center-image"
src="${center.photo}">

<div class="card-content">

<h2>

🍔 ${center.name}

</h2>

<div class="rating">

⭐ ${overall}/5

</div>

<div class="reviews">

📝 ${centerReviews.length} Reviews

</div>

<button class="view-btn">

View Audit Report →

</button>

</div>

</div>

`;

}

);

}

function openAudit(index){

window.location.href=

"audit.html?center="+index;

}

displayCenters();

</script>

</body>

</html>

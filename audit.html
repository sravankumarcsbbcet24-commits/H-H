<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Center Audit Report</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

padding:40px;

background:linear-gradient(135deg,#07111f,#102a43,#075985);

color:white;

}

.container{

max-width:1100px;

margin:auto;

background:rgba(255,255,255,.1);

backdrop-filter:blur(20px);

padding:40px;

border-radius:30px;

animation:fade 0.8s ease;

}

.header{

text-align:center;

margin-bottom:35px;

}

.header img{

width:220px;

height:220px;

object-fit:cover;

border-radius:20px;

margin-bottom:20px;

}

.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.stat-card{

background:rgba(255,255,255,.12);

padding:25px;

border-radius:20px;

text-align:center;

transition:.3s;

}

.stat-card:hover{

transform:translateY(-8px);

}

.stat-card h2{

font-size:30px;

margin-top:10px;

}

.feedback-section{

margin-top:40px;

}

.feedback-card{

background:rgba(255,255,255,.12);

padding:20px;

border-radius:15px;

margin-top:15px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img id="centerImage" src="">

<h1 id="centerName">

Food Center

</h1>

</div>

<div class="stats">

<div class="stat-card">

🧹

<h3>Cleanliness</h3>

<h2 id="cleanliness">0.0</h2>

</div>

<div class="stat-card">

🍽️

<h3>Food Quality</h3>

<h2 id="foodQuality">0.0</h2>

</div>

<div class="stat-card">

👨‍🍳

<h3>Staff Behaviour</h3>

<h2 id="staffBehaviour">0.0</h2>

</div>

<div class="stat-card">

🏢

<h3>Environment</h3>

<h2 id="environment">0.0</h2>

</div>

<div class="stat-card">

⭐

<h3>Average Rating</h3>

<h2 id="average">0.0</h2>

</div>

<div class="stat-card">

📝

<h3>Total Reviews</h3>

<h2 id="totalReviews">0</h2>

</div>

</div>

<div class="feedback-section">

<h2>

💬 Customer Feedback

</h2>

<div id="feedbackList">

</div>

</div>

</div>

<script>

let params=
new URLSearchParams(window.location.search);

let index=
params.get("center");

let centers=
JSON.parse(localStorage.getItem("foodCenters"))||[];

let reviews=
JSON.parse(localStorage.getItem("reviews"))||[];

let center=centers[index];

document.getElementById("centerName").innerText=
center.name;

document.getElementById("centerImage").src=
center.photo;

let centerReviews=
reviews.filter(

review=>

review.foodCenter===center.name

);

function average(field){

if(centerReviews.length===0){

return "0.0";

}

let total=0;

centerReviews.forEach(review=>{

total+=Number(review[field]);

});

return (

total/

centerReviews.length

).toFixed(1);

}

document.getElementById("cleanliness").innerText=

average("cleanliness");

document.getElementById("foodQuality").innerText=

average("foodQuality");

document.getElementById("staffBehaviour").innerText=

average("staffBehaviour");

document.getElementById("environment").innerText=

average("environment");

let overall=(

(

Number(average("cleanliness"))+

Number(average("foodQuality"))+

Number(average("staffBehaviour"))+

Number(average("environment"))

)/4

).toFixed(1);

document.getElementById("average").innerText=

overall;

document.getElementById("totalReviews").innerText=

centerReviews.length;

let feedbackList=

document.getElementById("feedbackList");

centerReviews.forEach(review=>{

feedbackList.innerHTML+=`

<div class="feedback-card">

${review.feedback}

</div>

`;

});

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Center Feedback Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

padding:40px;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#0284c7);

color:white;

}

.container{

max-width:1000px;

margin:auto;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

border-radius:30px;

padding:40px;

animation:fade 1s ease;

}

.header{

text-align:center;

margin-bottom:35px;

}

.header h1{

font-size:36px;

margin-bottom:10px;

}

.food-center{

text-align:center;

margin-bottom:30px;

}

.food-center img{

width:220px;

height:220px;

object-fit:cover;

border-radius:20px;

border:4px solid white;

margin-bottom:15px;

}

.audit-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:25px;

}

.audit-box{

background:rgba(255,255,255,.15);

padding:20px;

border-radius:20px;

}

.audit-box label{

display:block;

margin-bottom:10px;

font-size:18px;

}

select{

width:100%;

padding:12px;

border:none;

border-radius:10px;

font-size:16px;

}

textarea{

width:100%;

height:120px;

padding:15px;

border:none;

border-radius:15px;

resize:none;

font-size:16px;

margin-top:20px;

}

.submit-btn{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:15px;

font-size:18px;

cursor:pointer;

}

.summary{

margin-top:40px;

background:rgba(255,255,255,.15);

padding:30px;

border-radius:20px;

}

.summary h2{

margin-bottom:15px;

}

.review{

background:white;

color:black;

padding:15px;

border-radius:15px;

margin-top:10px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Food Center Hygiene Feedback Portal</h1>

<p>Health and Hygiene Awareness & Hygiene Audit System</p>

</div>

<div class="food-center">

<img
id="centerImage"
src="https://via.placeholder.com/220">

<h2 id="foodCenterName">

Food Center Name

</h2>

</div>

<div class="audit-grid">

<div class="audit-box">

<label>🧹 Cleanliness</label>

<select id="cleanliness">

<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>

</select>

</div>

<div class="audit-box">

<label>🍽️ Food Quality</label>

<select id="foodQuality">

<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>

</select>

</div>

<div class="audit-box">

<label>👨‍🍳 Staff Behaviour</label>

<select id="staffBehaviour">

<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>

</select>

</div>

<div class="audit-box">

<label>🏢 Environment</label>

<select id="environment">

<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>

</select>

</div>

</div>

<textarea
id="feedback"
placeholder="Write your feedback here...">

</textarea>

<button
class="submit-btn"
onclick="submitFeedback()">

Submit Feedback

</button>

<div class="summary">

<h2 id="average">

⭐ Average Rating: 0

</h2>

<h2 id="total">

📝 Total Reviews: 0

</h2>

<h2>

💬 Recent Feedback

</h2>

<div id="reviewList">

</div>

</div>

</div>

<script>

let params=
new URLSearchParams(
window.location.search
);

let index=
params.get("center");

let centers=
JSON.parse(
localStorage.getItem(
"foodCenters"
)
)||[];

if(index!==null&&centers[index]){

document.getElementById(
"foodCenterName"
).innerText=
centers[index].name;

document.getElementById(
"centerImage"
).src=
centers[index].photo;

}

let reviews=
JSON.parse(
localStorage.getItem(
"reviews"
)
)||[];

function loadReviews(){

let foodCenter=
document.getElementById(
"foodCenterName"
).innerText;

let filtered=
reviews.filter(

r=>r.foodCenter===foodCenter

);

let totalScore=0;

let reviewList=
document.getElementById(
"reviewList"
);

reviewList.innerHTML="";

filtered.forEach(r=>{

let score=

(
Number(r.cleanliness)+
Number(r.foodQuality)+
Number(r.staffBehaviour)+
Number(r.environment)

)/4;

totalScore+=score;

reviewList.innerHTML+=

'<div class="review">'+
r.feedback+
'</div>';

});

let average=

filtered.length?

(totalScore/filtered.length).toFixed(1)

:0;

document.getElementById(
"average"
).innerText=

"⭐ Average Rating: "+average;

document.getElementById(
"total"
).innerText=

"📝 Total Reviews: "+filtered.length;

}

function submitFeedback(){

let foodCenter=

document.getElementById(
"foodCenterName"
).innerText;

reviews.push({

foodCenter:foodCenter,

cleanliness:
document.getElementById(
"cleanliness"
).value,

foodQuality:
document.getElementById(
"foodQuality"
).value,

staffBehaviour:
document.getElementById(
"staffBehaviour"
).value,

environment:
document.getElementById(
"environment"
).value,

feedback:
document.getElementById(
"feedback"
).value

});

localStorage.setItem(

"reviews",

JSON.stringify(reviews)

);

document.getElementById(
"feedback"
).value="";

loadReviews();

alert(
"Feedback submitted successfully!"
);

}

loadReviews();

</script>

</body>

</html>
